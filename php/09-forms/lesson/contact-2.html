<!DOCTYPE html>
<!-- contact.html with an e-mail field. Lesson 19, slides 6-8. -->
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt</title>
</head>
<body>
  <!-- novalidate: skip the browser's e-mail check so PHP does it -->
  <form action="contact-2.php" method="post" novalidate>
    <label>Imię: <input type="text" name="userName"></label><br>
    <label>Wiadomość: <input type="text" name="userMessage"></label><br>
    <label>E-mail: <input type="email" name="userEmail"></label><br>
    <button type="submit">Wyślij</button>
  </form>
</body>
</html>
