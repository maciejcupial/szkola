<!DOCTYPE html>
<!--
  Second page of the site, reachable from the menu in index.html and contact.html.
  Header, nav and footer are copied from index.html without a single change, except for one thing:
  here class="active" sits on the link to about.html. The page styling comes from style.css.
-->
<html lang="pl">
<head>
  <!-- charset tells the browser the file is saved as UTF-8, so Polish letters render correctly -->
  <meta charset="UTF-8">
  <!-- viewport makes the page scale to the width of a phone instead of showing a zoomed out desktop -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- TU ZMIEŃ: tytuł widoczny na karcie przeglądarki -->
  <title>O nas</title>
  <!-- the same stylesheet as the other pages, so the menu looks the same everywhere -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- header: site name plus the menu, identical in every page -->
  <header>
    <!-- TU ZMIEŃ: nazwa strony (ta sama na każdej podstronie) -->
    <p class="logo">Nazwa strony</p>
    <!-- nav marks the block of links that moves the visitor between pages -->
    <nav>
      <a href="index.html">Start</a>
      <!-- class="active" moved here, because this is the page being displayed -->
      <a href="about.html" class="active">O nas</a>
      <a href="contact.html">Kontakt</a>
    </nav>
  </header>

  <!-- main holds what is unique to this page -->
  <main>
    <h1>O nas</h1>
    <!-- TU ZMIEŃ: opis, lista, obraz -->
    <p>Kim jesteśmy i co robimy.</p>
    <!-- ul is an unordered list; every item goes in its own li -->
    <ul>
      <li>pierwszy fakt</li>
      <li>drugi fakt</li>
    </ul>
  </main>

  <!-- footer: closing line of the page, identical in every page -->
  <footer>
    <!-- TU ZMIEŃ: autor -->
    <p>Autor: Imię Nazwisko, klasa 3TI</p>
  </footer>
</body>
</html>
