<?xml version="1.0" encoding="UTF-8"?>
<!-- Local image A: a blue rectangle with a big letter. Loaded by index.html and swapped by script.js. -->
<!-- SVG is a picture described by text, so it needs no network and no extra files. -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120" role="img"
     aria-label="Obrazek A">
  <!-- The rectangle fills the whole drawing area and gives the picture its colour. -->
  <rect width="240" height="120" rx="12" fill="#1f6feb"/>
  <!-- x and y place the middle of the text; text-anchor and dominant-baseline centre it exactly. -->
  <text x="120" y="60" text-anchor="middle" dominant-baseline="central"
        font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">A</text>
</svg>
