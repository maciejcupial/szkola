<?xml version="1.0" encoding="UTF-8"?>
<!--
  Placeholder picture drawn by hand, so the demo needs no internet and no downloads.
  On the lesson this file is a real photo (JPG or WebP) put through squoosh.app first.
  It really is 640 by 360 pixels, so width="640" height="360" in the HTML is the truth.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"
     role="img" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="360" fill="#14506b"/>
  <circle cx="320" cy="130" r="47" fill="#ffd54f"/>
  <rect x="51" y="216" width="538" height="94" rx="14" fill="#4fc3f7"/>
  <rect x="0" y="290" width="640" height="70" fill="#0a1420" fill-opacity="0.72"/>
  <text x="320" y="326" text-anchor="middle" fill="#f2f5f9"
        font-size="27" font-weight="700">Jezioro</text>
  <text x="320" y="351" text-anchor="middle" fill="#cfd9e4"
        font-size="18">rysunek zastępczy, 640 na 360 pikseli</text>
</svg>
