<!DOCTYPE html>
<!-- One-page personal website; menu links jump to section ids below. -->
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <!-- Without this line the @media rule in style.css does not work on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- TU ZMIEŃ: tytuł widoczny na karcie przeglądarki -->
  <title>Moja strona</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <!-- TU ZMIEŃ: nazwa strony -->
    <h1>Moja strona</h1>
    <!-- href="#about" scrolls to id="about" on this page -->
    <nav>
      <a href="#about">O mnie</a>
      <a href="#interests">Zainteresowania</a>
      <a href="#schedule">Plan tygodnia</a>
    </nav>
  </header>

  <main>
    <section id="about">
      <h2>O mnie</h2>
      <!-- TU ZMIEŃ: własne zdjęcie (plik w tym folderze) i opis -->
      <img src="photo.svg" alt="Zdjęcie autora strony" width="320">
      <p>Kilka zdań o sobie.</p>
    </section>

    <section id="interests">
      <h2>Zainteresowania</h2>
      <ul>
        <!-- TU ZMIEŃ: własne zainteresowania, dopisz albo usuń pozycje listy -->
        <li>pierwsze zainteresowanie</li>
        <li>drugie zainteresowanie</li>
        <!-- target="_blank" always goes with rel="noopener" -->
        <li>
          <a href="https://pl.wikipedia.org" target="_blank" rel="noopener">łącze do strony zewnętrznej</a>
        </li>
      </ul>
    </section>

    <section id="schedule">
      <h2>Plan tygodnia</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">Dzień</th>
            <th scope="col">Zajęcia</th>
            <th scope="col">Godzina</th>
          </tr>
        </thead>
        <tbody>
          <!-- TU ZMIEŃ: własny plan, każdy wiersz tabeli to jedno <tr> -->
          <tr>
            <td>Wtorek</td>
            <td>Informatyka</td>
            <td>11:45</td>
          </tr>
          <tr>
            <td>Czwartek</td>
            <td>Trening</td>
            <td>17:00</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <!-- TU ZMIEŃ: autor -->
    <p class="meta">Imię Nazwisko, klasa 2TI</p>
  </footer>
</body>
</html>
